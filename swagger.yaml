openapi: 3.0.0

info:
  title: API cửa hàng
  version: 1.0.0

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []

paths:

  /products:

    get:
      summary: Get all products

      responses:
        200:
          description: Get all products success

    post:
      summary: Create product

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: number
                stock:
                  type: number

      responses:
        201:
          description: Product created

  /products/{id}:

    get:
      summary: Get single product

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      responses:
        200:
          description: Get single product success

    put:
      summary: Update product

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: number
                stock:
                  type: number

      responses:
        200:
          description: Product updated

    delete:
      summary: Delete product

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      responses:
        200:
          description: Product deleted

  /api/auth/register:

    post:
      summary: Register user

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string

      responses:
        201:
          description: Register success

  /api/auth/login:

    post:
      summary: Login user

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string

      responses:
        200:
          description: Login success