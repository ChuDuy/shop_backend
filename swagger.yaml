openapi: 3.0.0

info:
  title: Shop API
  version: 1.0.0

paths:

  /products:

    get:
      summary: Get all products

    post:
      summary: Create product
      requestBody:
      required: true

    content:
      application/json:

    schema :
      type : object

    properties :
    name : 
      type : string
    price :
      type : number
    stock :
    type : number
  /products/{id}:

    get:
      summary: Get single product

    put:
      summary: Update product
    requestBody:
      required: true

    content:
      application/json:

    schema :
      type : object

    properties :
    name : 
      type : string
    price :
      type : number
    stock :
      type : number
    delete:
      summary: Delete product

  /api/auth/register:

    post:
      summary: Register user
    requestBody:
      required: true

    content:
      application/json:

    schema :
      type : object

    properties :
    name : 
      type : string
    email:
      type : string

    password :
      type : string

  /api/auth/login:

    post:
      summary: Login user
    requestBody:
      required: true

    content:
      application/json:

    schema :
      type : object

    properties :

    email:
     type : string

    password :
      type : string

